<!DOCTYPE html><br/><html lang="zh-CN"><br/><head><br/><meta charset="UTF-8"><br/><meta name="viewport" content="width=device-width, initial-scale=1.0"><br/><title>趣味性格测试</title><br/><style><br/>  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }<br/>  body {<br/>    min-height:100vh;<br/>    background:linear-gradient(145deg,#f6f0e7 0%,#e8dccc 100%);<br/>    display:flex; align-items:center; justify-content:center; padding:20px;<br/>  }<br/>  .card {<br/>    max-width:700px; width:100%;<br/>    background:rgba(255,255,255,0.9);<br/>    border-radius:48px; padding:40px 35px;<br/>    box-shadow:0 25px 40px -10px rgba(0,0,0,0.2);<br/>  }<br/>  h1 { font-size:2rem; color:#3b2e26; margin-bottom:12px; }<br/>  h1 span { background:#d9b382; font-size:1.3rem; border-radius:50px; padding:4px 16px; color:#2f241e; }<br/>  .subhead { color:#6b5a4e; font-size:1rem; margin-bottom:30px; border-left:5px solid #d9b382; padding-left:18px; font-style:italic; }<br/>  .pass-gate { background:#fefbf7; border-radius:36px; padding:30px 24px; border:1px solid #ebdfd3; text-align:center; }<br/>  .pass-gate h2 { font-size:1.5rem; color:#3b2e26; margin-bottom:12px; }<br/>  .pass-gate p { color:#7a6a5c; margin-bottom:24px; }<br/>  .input-group { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-bottom:18px; }<br/>  .input-group input {<br/>    flex:1 1 240px; padding:16px 22px; border:2px solid #e2d5c9; border-radius:60px;<br/>    font-size:1.1rem; background:white; outline:none; text-align:center; font-weight:500;<br/>  }<br/>  .input-group input:focus { border-color:#b99a7a; box-shadow:0 0 0 5px #d9b38240; }<br/>  .input-group button {<br/>    background:#3b2e26; border:none; color:white; padding:16px 38px; border-radius:60px;<br/>    font-size:1.1rem; font-weight:600; cursor:pointer;<br/>  }<br/>  .input-group button:hover { background:#5a4133; }<br/>  .error-msg {<br/>    color:#c2564b; background:#ffeae6; border-radius:60px; padding:12px 16px;<br/>    font-size:0.95rem; margin-top:8px; display:inline-block; border:1px solid #ffcdc4;<br/>  }<br/>  .quiz-area { display:none; }<br/>  .progress { display:flex; justify-content:space-between; margin-bottom:22px; background:#fff2e7; padding:12px 22px; border-radius:60px; }<br/>  .progress .current { background:#d9b382; padding:4px 14px; border-radius:40px; font-weight:700; }<br/>  .question-text { font-size:1.6rem; font-weight:600; color:#2f241e; margin-bottom:28px; }<br/>  .options { display:flex; flex-direction:column; gap:14px; margin-bottom:30px; }<br/>  .option-btn {<br/>    background:white; border:2px solid #ebdfd3; padding:18px 24px; border-radius:60px;<br/>    font-size:1.1rem; text-align:left; cursor:pointer; display:flex; align-items:center; gap:16px;<br/>  }<br/>  .option-btn:hover { background:#faf3ed; border-color:#b99a7a; }<br/>  .option-btn.selected { background:#f0e3d6; border-color:#9b7b60; }<br/>  .option-btn .letter {<br/>    background:#f0e3d6; width:36px; height:36px; display:flex; align-items:center;<br/>    justify-content:center; border-radius:50%; font-weight:700; flex-shrink:0;<br/>  }<br/>  .option-btn.selected .letter { background:#b99a7a; color:white; }<br/>  .quiz-footer { display:flex; justify-content:space-between; gap:15px; }<br/>  .btn-secondary { background:transparent; border:2px solid #d0bcab; color:#5a4a3e; padding:14px 26px; border-radius:60px; cursor:pointer; }<br/>  .btn-secondary:disabled { opacity:0.4; cursor:not-allowed; }<br/>  .btn-primary { background:#3b2e26; border:none; color:white; padding:16px 38px; border-radius:60px; cursor:pointer; font-weight:600; }<br/>  .btn-primary:hover { background:#5a4133; }<br/>  .result-area { display:none; text-align:center; }<br/>  .result-card { background:#fefbf7; border-radius:40px; padding:34px 28px; border:1px solid #ebdfd3; }<br/>  .result-emoji { font-size:5rem; margin-bottom:12px; }<br/>  .result-title { font-size:2rem; font-weight:800; color:#2f241e; margin-bottom:16px; }<br/>  .result-desc { font-size:1.1rem; color:#5a4a3e; line-height:1.6; margin-bottom:30px; background:#f3ede7; padding:22px; border-radius:28px; }<br/>  .again-btn { background:white; border:2px solid #b99a7a; color:#3b2e26; padding:14px 38px; border-radius:60px; cursor:pointer; font-weight:600; }<br/>  .hidden { display:none !important; }<br/></style><br/></head><br/><body><br/><div class="card"><br/>  <h1><span class="emoji emoji2747"></span> 性格小测验 <span>专属版</span></h1><br/>  <div class="subhead">输入专属密码，解锁你的性格分析</div><br/><br/>  <!-- 密码区 --><br/>  <div id="passGate" class="pass-gate"><br/>    <h2><span class="emoji emoji1f510"></span> 请输入密码</h2><br/>    <p>使用你获得的密码开始测试</p ><br/>    <div class="input-group"><br/>      <input type="text" id="passwordInput" placeholder="请输入密码" autocomplete="off"><br/>      <button id="submitPassBtn">验证</button><br/>    </div><br/>    <div id="passError" class="error-msg hidden"></div><br/>  </div><br/><br/>  <!-- 测试区 --><br/>  <div id="quizArea" class="quiz-area"><br/>    <div class="progress"><br/>      <span>问题 <span id="currentQNum" class="current">1</span> / <span id="totalQNum">6</span></span><br/>      <span id="progressPercent">16%</span><br/>    </div><br/>    <div id="questionText" class="question-text"></div><br/>    <div id="optionsContainer" class="options"></div><br/>    <div class="quiz-footer"><br/>      <button id="prevBtn" class="btn-secondary" disabled>← 上一题</button><br/>      <button id="nextBtn" class="btn-primary">下一题 →</button><br/>    </div><br/>  </div><br/><br/>  <!-- 结果区 --><br/>  <div id="resultArea" class="result-area"><br/>    <div class="result-card"><br/>      <div id="resultEmoji" class="result-emoji"><span class="emoji emoji1f31f"></span></div><br/>      <div id="resultTitle" class="result-title"></div><br/>      <div id="resultDesc" class="result-desc"></div><br/>      <button id="restartBtn" class="again-btn">重新测试</button><br/>    </div><br/>  </div><br/></div><br/><br/><script><br/>// ============ 1. 五个密码（随便改） ============<br/>const VALID_PASSWORDS = [<br/>  'XINGZUO-01',<br/>  'XINGZUO-02',<br/>  'XINGZUO-03',<br/>  'XINGZUO-04',<br/>  'XINGZUO-05'<br/>];<br/><br/>// ============ 2. 题库 ============<br/>const questions = [<br/>  { text: "周末的夜晚，你更倾向于？", options: [<br/>    { text: "约朋友去热闹的派对或夜市", scores: { lively:3, warm:1 } },<br/>    { text: "一个人看书、看电影或打游戏", scores: { thoughtful:3, calm:1 } },<br/>    { text: "和两三个好友在家做饭聊天", scores: { warm:3, lively:1 } },<br/>    { text: "规划下周的事情，整理房间", scores: { calm:3, thoughtful:1 } }<br/>  ]},<br/>  { text: "当你遇到一个难题时，你首先会？", options: [<br/>    { text: "立刻动手尝试，边做边想", scores: { lively:2, calm:1 } },<br/>    { text: "先冷静分析，列出所有可能", scores: { thoughtful:3, calm:2 } },<br/>    { text: "找有经验的人聊聊，听听建议", scores: { warm:3, lively:1 } },<br/>    { text: "自己查资料，研究清楚再行动", scores: { thoughtful:2, calm:2 } }<br/>  ]},<br/>  { text: "朋友眼中的你，更接近哪种描述？", options: [<br/>    { text: "开心果，总能活跃气氛", scores: { lively:3, warm:1 } },<br/>    { text: "靠谱的倾听者，善解人意", scores: { warm:3, thoughtful:1 } },<br/>    { text: "独立有主见，不太随大流", scores: { calm:3, thoughtful:1 } },<br/>    { text: "好奇宝宝，喜欢尝试新鲜事物", scores: { lively:2, calm:1 } }<br/>  ]},<br/>  { text: "如果突然得到一笔奖金，你会？", options: [<br/>    { text: "立刻买下心心念念的东西", scores: { lively:3 } },<br/>    { text: "存起来，为未来做规划", scores: { calm:3, thoughtful:1 } },<br/>    { text: "请家人朋友吃大餐、送礼物", scores: { warm:3, lively:1 } },<br/>    { text: "报个课程或投资自己", scores: { thoughtful:3, calm:1 } }<br/>  ]},<br/>  { text: "在团队合作中，你通常扮演什么角色？", options: [<br/>    { text: "点子王，提出各种创意", scores: { lively:3, warm:1 } },<br/>    { text: "执行者，把想法落地", scores: { calm:3, thoughtful:1 } },<br/>    { text: "协调者，关心每个人的感受", scores: { warm:3 } },<br/>    { text: "观察者，在关键时刻给出建议", scores: { thoughtful:3, calm:2 } }<br/>  ]},<br/>  { text: "旅行时，你更喜欢哪种方式？", options: [<br/>    { text: "说走就走，随心探索", scores: { lively:3, calm:1 } },<br/>    { text: "提前做好详细攻略", scores: { thoughtful:3, calm:2 } },<br/>    { text: "和伴侣或好友一起，边走边聊", scores: { warm:3, lively:2 } },<br/>    { text: "一个人安静地感受当地文化", scores: { calm:3, thoughtful:1 } }<br/>  ]}<br/>];<br/><br/>const PERSONALITY_TYPES = [<br/>  { id:'lively', emoji:'<span class="emoji emoji26a1"></span>', title:'活泼冒险家', desc:'你像一阵清新的风，走到哪里都能带来活力。热爱新鲜事物，行动力超强，身边永远不会无聊。' },<br/>  { id:'thoughtful', emoji:'🧠', title:'沉稳思考者', desc:'你拥有深邃的内心世界，喜欢独立钻研。做事有条理，善于分析，总能一眼看穿问题本质。' },<br/>  { id:'warm', emoji:'<span class="emoji emoji1f33c"></span>', title:'温暖陪伴者', desc:'你温柔而可靠，重视人与人之间的情感联结。总是体贴他人，善于倾听，朋友都喜欢向你倾诉。' },<br/>  { id:'calm', emoji:'🧊', title:'冷静分析家', desc:'你理性、沉着，遇事不慌。喜欢用逻辑和规划解决问题，独立又可靠，是很多人的定海神针。' }<br/>];<br/><br/>// ============ 3. DOM ============<br/>const passGate = document.getElementById('passGate');<br/>const quizArea = document.getElementById('quizArea');<br/>const resultArea = document.getElementById('resultArea');<br/>const passwordInput = document.getElementById('passwordInput');<br/>const submitPassBtn = document.getElementById('submitPassBtn');<br/>const passError = document.getElementById('passError');<br/>const currentQNumSpan = document.getElementById('currentQNum');<br/>const totalQNumSpan = document.getElementById('totalQNum');<br/>const progressPercent = document.getElementById('progressPercent');<br/>const questionText = document.getElementById('questionText');<br/>const optionsContainer = document.getElementById('optionsContainer');<br/>const prevBtn = document.getElementById('prevBtn');<br/>const nextBtn = document.getElementById('nextBtn');<br/>const resultEmoji = document.getElementById('resultEmoji');<br/>const resultTitle = document.getElementById('resultTitle');<br/>const resultDesc = document.getElementById('resultDesc');<br/>const restartBtn = document.getElementById('restartBtn');<br/><br/>let currentQuestionIndex = 0;<br/>let answers = new Array(questions.length).fill(null);<br/>totalQNumSpan.textContent = questions.length;<br/><br/>// ============ 4. 密码验证（纯前端，极简） ============<br/>function checkPassword(input) {<br/>  const pwd = input.trim().toUpperCase();<br/>  return VALID_PASSWORDS.includes(pwd);<br/>}<br/><br/>submitPassBtn.addEventListener('click', () => {<br/>  const pwd = passwordInput.value;<br/>  if (!pwd.trim()) {<br/>    passError.textContent = '请输入密码';<br/>    passError.classList.remove('hidden');<br/>    return;<br/>  }<br/>  if (!checkPassword(pwd)) {<br/>    passError.textContent = '密码不正确，请检查后重试';<br/>    passError.classList.remove('hidden');<br/>    return;<br/>  }<br/>  // 通过<br/>  passGate.style.display = 'none';<br/>  quizArea.style.display = 'block';<br/>  resetQuizState();<br/>  renderQuestion(0);<br/>});<br/><br/>passwordInput.addEventListener('keypress', (e) => {<br/>  if (e.key === 'Enter') submitPassBtn.click();<br/>});<br/>passwordInput.addEventListener('input', () => passError.classList.add('hidden'));<br/><br/>// ============ 5. 测试逻辑 ============<br/>function resetQuizState() {<br/>  currentQuestionIndex = 0;<br/>  answers = new Array(questions.length).fill(null);<br/>}<br/><br/>function updateProgress() {<br/>  const total = questions.length;<br/>  const current = currentQuestionIndex + 1;<br/>  currentQNumSpan.textContent = current;<br/>  progressPercent.textContent = Math.round((current/total)*100) + '%';<br/>  prevBtn.disabled = currentQuestionIndex === 0;<br/>  nextBtn.textContent = currentQuestionIndex === total-1 ? '查看结果 <span class="emoji emoji1f389"></span>' : '下一题 →';<br/>}<br/><br/>function renderQuestion(index) {<br/>  currentQuestionIndex = index;<br/>  const q = questions[index];<br/>  questionText.textContent = q.text;<br/>  optionsContainer.innerHTML = '';<br/><br/>  q.options.forEach((opt, optIndex) => {<br/>    const btn = document.createElement('button');<br/>    btn.classList.add('option-btn');<br/>    if (answers[index] === optIndex) btn.classList.add('selected');<br/><br/>    const letterSpan = document.createElement('span');<br/>    letterSpan.classList.add('letter');<br/>    letterSpan.textContent = String.fromCharCode(65 + optIndex);<br/>    btn.appendChild(letterSpan);<br/>    btn.appendChild(document.createTextNode(opt.text));<br/><br/>    btn.addEventListener('click', () => {<br/>      answers[index] = optIndex;<br/>      optionsContainer.querySelectorAll('.option-btn').forEach((b,i) => {<br/>        b.classList.toggle('selected', i === optIndex);<br/>      });<br/>    });<br/><br/>    optionsContainer.appendChild(btn);<br/>  });<br/><br/>  updateProgress();<br/>}<br/><br/>function goToNext() {<br/>  if (answers[currentQuestionIndex] === null) {<br/>    alert('请先选择一个选项哦 <span class="emoji emoji1f60a"></span>');<br/>    return;<br/>  }<br/>  if (currentQuestionIndex === questions.length - 1) {<br/>    showResult();<br/>  } else {<br/>    renderQuestion(currentQuestionIndex + 1);<br/>  }<br/>}<br/><br/>function goToPrev() {<br/>  if (currentQuestionIndex > 0) renderQuestion(currentQuestionIndex - 1);<br/>}<br/><br/>prevBtn.addEventListener('click', goToPrev);<br/>nextBtn.addEventListener('click', goToNext);<br/><br/>// ============ 6. 计算结果 ============<br/>function calculatePersonality() {<br/>  const scores = { lively:0, thoughtful:0, warm:0, calm:0 };<br/>  questions.forEach((q, i) => {<br/>    const sel = answers[i];<br/>    if (sel === null) return;<br/>    const opt = q.options[sel];<br/>    if (opt.scores) {<br/>      for (const [k,v] of Object.entries(opt.scores)) {<br/>        if (scores[k] !== undefined) scores[k] += v;<br/>      }<br/>    }<br/>  });<br/>  let maxType = 'lively', maxScore = -1;<br/>  for (const [type, score] of Object.entries(scores)) {<br/>    if (score > maxScore) { maxScore = score; maxType = type; }<br/>  }<br/>  return PERSONALITY_TYPES.find(p => p.id === maxType) || PERSONALITY_TYPES[0];<br/>}<br/><br/>function showResult() {<br/>  quizArea.style.display = 'none';<br/>  resultArea.style.display = 'block';<br/>  const p = calculatePersonality();<br/>  resultEmoji.textContent = p.emoji;<br/>  resultTitle.textContent = p.title;<br/>  resultDesc.textContent = p.desc;<br/>}<br/><br/>restartBtn.addEventListener('click', () => {<br/>  // 重新测试，回到密码页<br/>  resultArea.style.display = 'none';<br/>  passGate.style.display = 'block';<br/>  passwordInput.value = '';<br/>  passError.classList.add('hidden');<br/>  resetQuizState();<br/>});<br/></script><br/></body><br/></html>
